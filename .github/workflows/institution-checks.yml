name: Institution reconciliation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Reconciliation regression tests
        run: pnpm run test:institution
      - name: System audit regression checks
        run: |
          node scripts/test-system-audit.mjs
          node scripts/test-json-request.mjs
      - name: Core reconciliation and transfer regression tests
        run: |
          for test in scripts/test-reconcile.mjs scripts/test-fractional-quantity-notes.mjs scripts/test-add-transfer.mjs scripts/test-exchange.mjs scripts/test-history-export.mjs scripts/test-reverse-lookup.mjs scripts/test-serial-soldier.mjs scripts/test-sap-invoice-register.mjs; do
            node "$test"
          done
      - name: SAP source authenticity and reference integrity tests
        run: node scripts/test-sap-source-integrity.mjs
      - name: Blue invoice and SAP transfer lookup regressions
        run: node scripts/test-blue-invoice-lookup.mjs
      - name: First lieutenant 011 regression tests
        run: |
          node scripts/test-lieutenant-import.mjs
          node scripts/test-sap-files.mjs
          node scripts/test-sap-archive.mjs
          node scripts/test-lieutenant.mjs
          node scripts/test-lieutenant-invoice-day.mjs
          node scripts/test-lieutenant-opening-stock.mjs
          node scripts/test-lieutenant-cancellation-decisions.mjs
          node scripts/test-reassurance.mjs
      - name: SAP 011 closing stock query regression tests
        run: node scripts/test-sap-stock-query.mjs
      - name: Unified SAP export query and parser regression tests
        run: node scripts/test-unified-sap.mjs
      - name: Storage, invoice registry and uniqueness checks
        run: |
          python3 scripts/test-storage.py
          python3 scripts/test-invoice-register.py
          python3 scripts/test-document-uniqueness.py
      - name: Aqaba document reconciliation regression tests
        run: |
          node scripts/test-aqaba.mjs
          node scripts/test-aqaba-price-edit.mjs
      - name: TypeScript validation
        run: pnpm exec tsc --noEmit
      - name: Appearance, print and login checks
        run: node scripts/test-theme.mjs
      - name: Production build
        run: pnpm run build
