name: Institution reconciliation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Reconciliation regression tests
        run: pnpm run test:institution
      - name: Core reconciliation and transfer regression tests
        run: |
          for test in scripts/test-reconcile.mjs scripts/test-add-transfer.mjs scripts/test-exchange.mjs scripts/test-history-export.mjs scripts/test-reverse-lookup.mjs scripts/test-serial-soldier.mjs scripts/test-sap-invoice-register.mjs; do
            node "$test"
          done
      - name: Storage, invoice registry and uniqueness checks
        run: |
          python3 scripts/test-storage.py
          python3 scripts/test-invoice-register.py
          python3 scripts/test-document-uniqueness.py
      - name: TypeScript validation
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm run build
