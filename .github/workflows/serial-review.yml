name: Saja serial review checks
on:
  push:
    paths:
      - 'app/lib/serial-soldier.ts'
      - 'app/lib/serial-workbook.ts'
      - 'app/reconciliation/SerialSoldier.tsx'
      - 'scripts/test-serial-soldier.mjs'
      - '.github/workflows/serial-review.yml'
  pull_request:
    paths:
      - 'app/lib/serial-soldier.ts'
      - 'app/lib/serial-workbook.ts'
      - 'app/reconciliation/SerialSoldier.tsx'
      - 'scripts/test-serial-soldier.mjs'
      - '.github/workflows/serial-review.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Serial soldier regression
        run: node scripts/test-serial-soldier.mjs
